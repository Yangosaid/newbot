name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: bus-signing-key-v1
      - name: Create signing key (first build only)
        run: |
          mkdir -p .signing
          [ -f .signing/bus.p12 ] || keytool -genkeypair -keystore .signing/bus.p12 -storetype PKCS12 \
            -storepass "$BUS_KEYSTORE_PASS" -keypass "$BUS_KEYSTORE_PASS" -alias bus -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bus Battle"
        env:
          BUS_KEYSTORE_PASS: bus-local-signing
      - name: Build
        run: gradle --no-daemon assembleRelease
        env:
          BUS_KEYSTORE: ${{ github.workspace }}/.signing/bus.p12
          BUS_KEYSTORE_PASS: bus-local-signing
      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/tiktok/release/app-tiktok-release.apk bus-battle.apk
          cp app/build/outputs/apk/youtube/release/app-youtube-release.apk vox-vs-psoe.apk
          cp downloader/build/outputs/apk/release/downloader-arm64-v8a-release.apk vidsaver-arm64.apk
          cp downloader/build/outputs/apk/release/downloader-armeabi-v7a-release.apk vidsaver-armv7.apk
          cp streamer/build/outputs/apk/release/streamer-release.apk screen-live.apk
          cp app/build/outputs/apk/facebook/release/app-facebook-release.apk fiesta-facebook.apk
          cp app/build/outputs/apk/twitch/release/app-twitch-release.apk fiesta-twitch.apk
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: '*.apk'
      - name: Publish download link (release "apk")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace each file without taking the download link down: upload the new file under a temporary name, then
          # delete the old one and rename the new one (a gap of milliseconds instead of the whole upload).
          publish() {
            tag="$1"; title="$2"; notes="$3"; shift 3
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" "$@" --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"; return
            fi
            for f in "$@"; do
              cp "$f" "new-$f"
              gh release upload "$tag" "new-$f" --clobber
              old=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[]|select(.name==\"$f\")|.id")
              new=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[]|select(.name==\"new-$f\")|.id")
              if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new" -f name="$f" >/dev/null
            done
            gh release edit "$tag" --title "$title" --notes "$notes"
          }
          publish apk "Bus Battle APK (build ${GITHUB_RUN_NUMBER})" \
            "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download bus-battle.apk on the phone and install it." bus-battle.apk
          publish vidsaver "VidSaver APK (build ${GITHUB_RUN_NUMBER})" \
            "TikTok / YouTube / Shorts downloader. Most phones: vidsaver-arm64.apk. Older 32-bit phones: vidsaver-armv7.apk." vidsaver-arm64.apk vidsaver-armv7.apk
          publish twitch "Fiesta Twitch (build ${GITHUB_RUN_NUMBER})" \
            "Dance hall and all the games for Twitch: chat makes people dance; Bits, subs, gifted subs and raids count as gifts. Just type your channel name. Download fiesta-twitch.apk." fiesta-twitch.apk
          publish facebook "Fiesta Facebook (build ${GITHUB_RUN_NUMBER})" \
            "Dance hall and all the games for Facebook Live (Page lives): comments make people dance, reactions fill the room. Download fiesta-facebook.apk." fiesta-facebook.apk
          publish streamer "Directo de pantalla / بث الشاشة (build ${GITHUB_RUN_NUMBER})" \
            "Stream the phone screen live to YouTube, Facebook, Twitch, Kick or any RTMP server. Download screen-live.apk." screen-live.apk
          publish vox-psoe "VOX vs PSOE - YouTube (build ${GITHUB_RUN_NUMBER})" \
            "Bus battle for YouTube live chat: every comment naming a team pushes its buses; Super Chats and members count extra." vox-vs-psoe.apk
