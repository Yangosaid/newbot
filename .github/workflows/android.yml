name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: bus-signing-key-v1
      - name: Create signing key (first build only)
        run: |
          mkdir -p .signing
          [ -f .signing/bus.p12 ] || keytool -genkeypair -keystore .signing/bus.p12 -storetype PKCS12 \
            -storepass "$BUS_KEYSTORE_PASS" -keypass "$BUS_KEYSTORE_PASS" -alias bus -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bus Battle"
        env:
          BUS_KEYSTORE_PASS: bus-local-signing
      - name: Build
        run: gradle --no-daemon assembleRelease
        env:
          BUS_KEYSTORE: ${{ github.workspace }}/.signing/bus.p12
          BUS_KEYSTORE_PASS: bus-local-signing
      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk bus-battle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bus-battle-apk
          path: bus-battle.apk
      - name: Publish download link (release "apk")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk bus-battle.apk --target "$GITHUB_SHA" --prerelease \
            --title "Bus Battle APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download bus-battle.apk on the phone and install it."
