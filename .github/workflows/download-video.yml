name: Download video

on:
  push:
    branches: [ccr-b6a89f7d-dnxb2t]
    paths: [".github/workflows/download-video.yml", "video-url.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -U "yt-dlp[default]"
          yt-dlp --version

      - name: Download video (max 720p) and Spanish captions
        run: |
          URL=$(head -n1 video-url.txt)
          mkdir -p out
          yt-dlp --js-runtimes node \
            -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]/b" \
            --merge-output-format mp4 \
            --write-auto-subs --sub-langs "es-orig,es" --sub-format json3 \
            -o "out/video.%(ext)s" "$URL" || true
          ls -la out

      - name: Split into parts under 1.9 GB
        run: |
          cd out
          [ -f video.mp4 ] || { echo "download failed"; exit 1; }
          split -b 1900M -d video.mp4 video.mp4.part
          rm video.mp4
          ls -la

      - name: Publish as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-${{ github.run_id }}"
          gh release create "$TAG" out/* --target "${{ github.sha }}" \
            --title "$TAG" --notes "Downloaded from $(head -n1 video-url.txt)" --prerelease
