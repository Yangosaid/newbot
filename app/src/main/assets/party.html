<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiesta 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* A clean 3D night club: no text on screen except each supporter's name above their characters.
   Every supporter gets characters wearing their profile photo; the camera flies to the latest supporter and
   stays on them until someone else supports. Only a faint ⚙ button opens the settings sheet. */
:root{
  color-scheme:dark;
  --night:#06030e; --panel:#140d2a; --panel-2:#1f1640; --line:#3b2d6b;
  --ink:#f7f4ff; --ink-dim:#b4a9d6; --ok:#4ade80; --bad:#ff6b5e; --hot:#ff3d8b;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font:700 20px/1.3 var(--display)}
#gear{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(10,6,24,.45);
  color:var(--ink);font-size:19px;line-height:1;cursor:pointer;opacity:.35}
#gear i{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
#gear i.ok{background:var(--ok)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:0 16px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
#tabs{position:sticky;top:0;display:flex;gap:4px;align-items:center;background:var(--panel);padding:12px 0 8px;z-index:1}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-dim);font:800 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:8px 2px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hot)}
#close{background:var(--panel-2);border:0;color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
.grp{background:var(--panel-2);border-radius:12px;padding:10px 12px;margin:10px 0}
.grp h3{margin:0 0 6px;font:800 15px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:7px 0}
.ln label{flex:1;min-width:150px;font-size:14px}
.ln .grow{flex:1;min-width:0}
.note{font-size:13px;line-height:1.45;color:var(--ink-dim);margin:8px 0}
.btn{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:700 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.btn.go{background:var(--hot);border-color:var(--hot);color:#fff}
input[type=text],input[type=number],select{background:#0c0820;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:500 15px var(--body)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--hot)}
#st.ok{color:var(--ok)}#st.bad{color:var(--bad)}
#apLog{max-height:30vh;overflow:auto;white-space:pre-wrap;font:12px/1.35 monospace;color:var(--ink-dim);background:rgba(0,0,0,.35);border-radius:8px;padding:8px;margin:8px 0 0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="nogl" hidden>Este teléfono no puede mostrar gráficos 3D.<br>Vuelve a la batalla de buses desde ⚙.</div>
  <button id="gear" aria-label="Ajustes">⚙<i id="dot"></i></button>

  <div id="sheet" hidden>
    <div id="tabs" role="tablist">
      <button class="tab" role="tab" data-p="pCtl" aria-selected="true">Control</button>
      <button class="tab" role="tab" data-p="pRules" aria-selected="false">Reglas</button>
      <button class="tab" role="tab" data-p="pLink" aria-selected="false">Conexión</button>
      <button id="close" aria-label="Cerrar">✕</button>
    </div>
    <div class="pane" id="pCtl">
      <div class="ln"><button class="btn" id="bDemo"></button><button class="btn" id="bMusic"></button><button class="btn" id="bClear">Vaciar pista</button></div>
      <div class="ln"><button class="btn go" id="bBus">🚌 Ir a la batalla de buses</button></div>
      <div class="grp"><h3>Probar</h3>
        <div class="ln"><button class="btn" data-test="gift">Regalo</button><button class="btn" data-test="chat">Comentario</button></div>
      </div>
      <label class="ln"><input type="checkbox" id="oSafe"><span>Encuadrar por encima del chat del directo</span></label>
    </div>
    <div class="pane" id="pRules" hidden>
      <div class="grp"><h3>Personajes</h3>
        <p class="note">Cada apoyo añade un personaje con la foto y el nombre de quien apoya. La cámara va al último que apoya y se queda con él hasta que apoye otro.</p>
        <div class="ln"><label for="oPer">Personajes máximos por espectador</label><select id="oPer"><option value="1">1</option><option value="3">3</option><option value="6">6</option><option value="10">10</option></select></div>
        <div class="ln"><label for="oMax">Personajes máximos en la pista</label><select id="oMax"><option value="20">20</option><option value="40">40</option><option value="60">60</option></select></div>
        <div class="ln"><label for="oFill">Bailarines de relleno (sin foto)</label><select id="oFill"><option value="0">Ninguno</option><option value="6">6</option><option value="12">12</option><option value="18">18</option></select></div>
      </div>
      <div class="grp"><h3>Comentarios</h3>
        <label class="ln"><input type="checkbox" id="oChat"><span>Los comentarios también añaden personaje y mueven la cámara</span></label>
        <div class="ln"><label for="oWords">Palabras (vacío = cualquier comentario)</label><input type="text" id="oWords" class="grow"></div>
        <div class="ln"><label for="oCd">Espera por espectador</label><select id="oCd"><option value="3">3 s</option><option value="10">10 s</option><option value="30">30 s</option><option value="60">1 min</option></select></div>
      </div>
      <div class="grp"><h3>Pista</h3>
        <div class="ln"><label for="oBpm">Ritmo</label><select id="oBpm"><option value="100">100 BPM</option><option value="118">118 BPM</option><option value="128">128 BPM</option><option value="140">140 BPM</option></select></div>
        <div class="ln"><label for="oQ">Calidad</label><select id="oQ"><option value="2">Alta</option><option value="1.25">Media</option><option value="0.8">Ahorro de batería</option></select></div>
      </div>
    </div>
    <div class="pane" id="pLink" hidden>
      <div class="ln"><span>Estado:</span><span id="st" class="bad">Sin conexión</span></div>
      <p class="note" id="lnNote"></p>
      <div class="ln"><label for="apUser" id="apUserL">Tu usuario de TikTok</label><input type="text" id="apUser" class="grow" placeholder="usuario (sin @)" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
      <div class="ln" id="apKeyRow"><label for="apKey">Clave Euler Stream</label><input type="text" id="apKey" class="grow" placeholder="opcional" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
      <div class="ln"><button class="btn go" id="apGo">Guardar y conectar</button></div>
      <pre id="apLog"></pre>
    </div>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script>
(function(){

/* ---------- helpers ---------- */

function perf(){return performance.now()}

/* ---------- 3D scene ---------- */

    var cone=new THREE.Mesh(new THREE.CircleGeometry(0.42,24),new THREE.MeshStandardMaterial({color:0x222233,roughness:.4,metalness:.6,emissive:0x220a44}));cone.position.set(sp*3.4,1.5,-5.29);scene.add(cone);speakers.push(cone)}

/* ---------- supporters ---------- */
var users={},focus=null,lastFocusAt=0;
function userOf(e){var uid=String(e.user||e.nick||"?"),u=users[uid];
  if(!u)u=users[uid]={uid:uid,nick:String(e.nick||e.user||"Fan"),av:"",img:null,face:null,label:null,hue:hashHue(uid),lastChat:-1e9,chars:[]};
  if(e.nick&&String(e.nick)!==u.nick){u.nick=String(e.nick);if(u.label){u.label.dispose();u.label=null;relabel(u)}}
  if(e.avatar&&e.avatar!==u.av){u.av=String(e.avatar);loadPhoto(u)}
  return u}
/* Photos reach WebGL as same-origin pictures: inside the app Java fetches them (data: URL); in a browser preview they load normally. */
var imgWait={},imgN=0;
window.__busImg=function(id,data){var cb=imgWait[id];delete imgWait[id];if(cb)cb(data)};

  if(APP&&BusApp.image){var id="i"+(++imgN);imgWait[id]=done;try{BusApp.image(url,id)}catch(e){}}
  else done(url)}

  x.fillStyle="#ffffff";x.beginPath();x.arc(S/2,S/2,S/2,0,7);x.fill();
  x.save();x.beginPath();x.arc(S/2,S/2,S/2-10,0,7);x.clip();
  if(u&&u.img){var im=u.img,k=Math.max((S-20)/im.width,(S-20)/im.height);try{x.drawImage(im,(S-im.width*k)/2,(S-im.height*k)/2,im.width*k,im.height*k)}catch(e){}}

  var nm=u.nick.length>18?u.nick.slice(0,17)+"…":u.nick;x.font="700 52px 'Barlow Condensed',Arial,sans-serif";var w=Math.min(500,x.measureText(nm).width+44);

var anonTex=[];
function anonFace(i){if(!anonTex.length){var hues=[20,200,280,120,330,45];for(var k=0;k<6;k++)anonTex.push(tex(faceCanvas({hue:hues[k],anon:1})))}return anonTex[i%anonTex.length]}

var GEO={},MAT={},chars=[],fillers=[];

  MAT.shadow=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.45,depthWrite:false});MAT.shoe=new THREE.MeshLambertMaterial({color:0x111111})}
var OUT=[0xff3d8b,0x22d3ee,0xffd23f,0x34d399,0xa78bfa,0xfb7185,0xf97316,0x60a5fa,0xf472b6,0xe5e7eb],SKIN=[0xf5d0b5,0xe8b48f,0xc68863,0x9a6040,0x6e4126,0xf1c27d];
function lam(c){var k="l"+c;return MAT[k]||(MAT[k]=new THREE.MeshLambertMaterial({color:c}))}
function cloth(c){var k="c"+c;return MAT[k]||(MAT[k]=new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.05}))}
function makeChar(u,i,pos){geo();
  var out=OUT[(Math.random()*OUT.length)|0],pants=[0x1f2937,0x1e3a8a,0x312e81,0x3f3f46,0x111827][(Math.random()*5)|0],skin=SKIN[(Math.random()*SKIN.length)|0];

  var limb=function(parent,g,mat,x,y,len){var p=new THREE.Group();p.position.set(x,y,0);parent.add(p);var m=new THREE.Mesh(g,mat);m.position.y=-len/2;p.add(m);return p};
  var armL=limb(hips,GEO.upper,cloth(out),-0.33,0.74,0.4),armR=limb(hips,GEO.upper,cloth(out),0.33,0.74,0.4);
  var foreL=limb(armL,GEO.lower,lam(skin),0,-0.4,0.36),foreR=limb(armR,GEO.lower,lam(skin),0,-0.4,0.36);
  var hL=new THREE.Mesh(GEO.hand,lam(skin));hL.position.y=-0.4;foreL.add(hL);var hR=new THREE.Mesh(GEO.hand,lam(skin));hR.position.y=-0.4;foreR.add(hR);
  var legL=limb(hips,GEO.thigh,lam(pants),-0.13,0,0.48),legR=limb(hips,GEO.thigh,lam(pants),0.13,0,0.48);
  var kneeL=limb(legL,GEO.shin,lam(pants),0,-0.48,0.46),kneeR=limb(legR,GEO.shin,lam(pants),0,-0.48,0.46);
  var sL=new THREE.Mesh(GEO.shoe,MAT.shoe);sL.position.set(0,-0.48,0.06);kneeL.add(sL);var sR=new THREE.Mesh(GEO.shoe,MAT.shoe);sR.position.set(0,-0.48,0.06);kneeR.add(sR);
  var face=new THREE.Sprite(new THREE.SpriteMaterial({map:u?faceOf(u):anonFace(i)}));face.scale.set(0.74,0.74,1);face.position.y=1.22;hips.add(face);
  var d={u:u,root:root,hips:hips,armL:armL,armR:armR,foreL:foreL,foreR:foreR,legL:legL,legR:legR,kneeL:kneeL,kneeR:kneeR,face:face,
    style:(Math.random()*6)|0,off:Math.random()*2,x:pos.x,z:pos.z,hx:pos.x,hz:pos.z,tx:pos.x,tz:pos.z,next:0,spin:0,born:perf()};
  if(u){var nm=new THREE.Sprite(new THREE.SpriteMaterial({map:labelOf(u),transparent:true,depthWrite:false}));nm.scale.set(2.1,0.39,1);nm.position.y=1.78;hips.add(nm);d.name=nm}
  root.position.set(pos.x,0,pos.z);scene.add(root);return d}
function dispose(d){scene.remove(d.root);d.face.material.dispose();if(d.name)d.name.material.dispose()}
/* a free spot on the floor, away from everyone else */
function spot(front){var best=null,bd=-1;for(var t=0;t<24;t++){var p={x:rnd(-4.8,4.8),z:front?rnd(-0.6,3.3):rnd(-4.2,-0.8)},m=99;
    chars.concat(fillers).forEach(function(d){m=Math.min(m,Math.hypot(d.hx-p.x,d.hz-p.z))});if(m>bd){bd=m;best=p}if(m>1.4)break}return best}
function addChar(u){if(!ok3d)return null;
  if(u.chars.length>=Math.max(1,cfg.per|0)){var old=u.chars.shift();chars.splice(chars.indexOf(old),1);dispose(old)}
  while(chars.length>=Math.max(1,cfg.max|0)){var idx=-1;for(var i=0;i<chars.length;i++)if(chars[i].u!==focus&&chars[i].u!==u){idx=i;break}if(idx<0)idx=0;
    var o=chars.splice(idx,1)[0];o.u.chars.splice(o.u.chars.indexOf(o),1);dispose(o)}
  if(fillers.length&&chars.length+fillers.length>=Math.max(1,cfg.max|0)+(cfg.fill|0)){var f=fillers.shift();dispose(f)}
  var d=makeChar(u,chars.length,spot(true));chars.push(d);u.chars.push(d);return d}
function layoutFillers(){if(!ok3d)return;while(fillers.length>(cfg.fill|0))dispose(fillers.pop());
  while(fillers.length<(cfg.fill|0))fillers.push(makeChar(null,fillers.length,spot(false)))}

/* ---------- events from the live ---------- */
function onEvent(e){if(!e||!e.type)return;
  if(e.type==="status"){setStatus(e.ok,e.text);return}
  if(e.type==="gift"){var u=userOf(e),n=Math.max(1,e.count|0);for(var i=0;i<Math.min(n,cfg.per|0||1);i++)addChar(u);goTo(u);return}
  if(e.type==="chat"&&cfg.chat){var t=norm(e.text||""),ok=!String(cfg.words||"").trim();
    if(!ok)ok=String(cfg.words).split(",").some(function(w){w=norm(w);return w&&(/[a-z0-9]/.test(w)?(" "+t.replace(/[^a-z0-9]+/g," ")+" ").indexOf(" "+w+" ")>=0:t.indexOf(w)>=0)});
    if(!ok)return;var u2=userOf(e),now=perf();if(now-u2.lastChat<Math.max(0,+cfg.cd||0)*1000)return;u2.lastChat=now;
    if(!u2.chars.length)addChar(u2);goTo(u2)}}

/* ---------- camera: overview until someone supports, then fly to the latest supporter and stay ---------- */
var camPos,camLook,camAng=0;if(ok3d){camPos=new THREE.Vector3(0,4.6,13);camLook=new THREE.Vector3(0,1.9,-0.5)}
function goTo(u){focus=u;lastFocusAt=perf();camAng=rnd(-0.35,0.35)}
/* anyone standing between the camera and the focused character steps aside */
function clearView(target){var dx=camPos.x-target.x,dz=camPos.z-target.z,L=Math.hypot(dx,dz)||1;dx/=L;dz/=L;
  chars.concat(fillers).forEach(function(o){if(o===target)return;var rx=o.x-target.x,rz=o.z-target.z,along=rx*dx+rz*dz;if(along<=0.2||along>L+0.5)return;
    var side=rx*dz-rz*dx;if(Math.abs(side)>1.0)return;var sgn=side>=0?1:-1;
    o.tx=o.hx=clamp(o.x+sgn*dz*1.3,-5.4,5.4);o.tz=o.hz=clamp(o.z-sgn*dx*1.3,-4.4,3.6);o.fast=perf()+1500;o.next=perf()+4000})}
var tPos=ok3d?new THREE.Vector3():null,tLook=ok3d?new THREE.Vector3():null;
function stepCamera(now,dt){var t=now/1000,portrait=W/H<0.75;
  var d=focus&&focus.chars.length?focus.chars[focus.chars.length-1]:null;
  if(d){/* frame the newest character of the focused supporter: head and name in the clear band above the chat */
    var dist=portrait?5.8:4.8,a=camAng+Math.sin(t*0.25)*0.1;
    tLook.set(d.x,cfg.safe?0.95:1.3,d.z);tPos.set(d.x+Math.sin(a)*dist,2.7+Math.sin(t*0.3)*0.08,d.z+Math.cos(a)*dist);clearView(d)}
  else{tLook.set(0,1.9,-0.5);tPos.set(Math.sin(t*0.13)*2.2,4.6+Math.sin(t*0.21)*0.35,portrait?13.5:11)}
  var k=1-Math.exp(-dt*(d?2.4:1.2));camPos.lerp(tPos,k);camLook.lerp(tLook,k);cam.position.copy(camPos);cam.lookAt(camLook)}

/* ---------- animation ---------- */
var t0=perf();function beat(now){return (now-t0)/1000*cfg.bpm/60}
function animChar(d,now,b,dt){
  var ph=(b+d.off)*Math.PI,s=Math.sin(ph),a=Math.abs(s),st=d.style;
  var age=(now-d.born)/1000,pop=age<0.5?Math.sin(age/0.5*Math.PI/2):1;d.root.scale.setScalar(Math.max(0.01,pop));
  d.hips.position.y=0.95+a*(st===4?0.16:0.07);
  d.hips.rotation.z=st===3?s*0.12:s*0.04;d.hips.rotation.y=st===1?s*0.25:0;
  var L=d.armL.rotation,Rr=d.armR.rotation,fl=d.foreL.rotation,fr=d.foreR.rotation;
  if(st===0){L.set(s*0.8,0,-0.25);Rr.set(-s*0.8,0,0.25);fl.set(-0.9,0,0);fr.set(-0.9,0,0)}
  else if(st===1){L.set(0,0,-2.6-0.3*Math.sin(ph*2));Rr.set(0,0,2.6+0.3*Math.sin(ph*2));fl.set(0,0,-0.3);fr.set(0,0,0.3)}
  else if(st===2){var up=Math.floor(b+d.off)%2===0;L.set(0,0,up?-2.5:-0.3);Rr.set(0,0,up?0.3:2.5);fl.set(up?-0.2:-1.2,0,0);fr.set(up?-1.2:-0.2,0,0)}
  else if(st===3){L.set(0,0,-1.3-0.3*s);Rr.set(0,0,1.3-0.3*s);fl.set(0,0,-0.6*s);fr.set(0,0,-0.6*s)}
  else if(st===4){L.set(0,0,-0.5-2*a);Rr.set(0,0,0.5+2*a);fl.set(0,0,-0.2);fr.set(0,0,0.2)}
  else{L.set(-1.4+0.4*s,0,-0.2);Rr.set(-1.4-0.4*s,0,0.2);fl.set(-1.2,0,0);fr.set(-1.2,0,0)}
  var bend=0.25+a*(st===4?0.6:0.3);d.legL.rotation.set(-bend*0.5+s*0.25,0,-0.06);d.legR.rotation.set(-bend*0.5-s*0.25,0,0.06);
  d.kneeL.rotation.x=bend;d.kneeR.rotation.x=bend;
  if(now>d.next){d.next=now+rnd(3000,8000);d.tx=clamp(d.hx+rnd(-0.6,0.6),-5.2,5.2);d.tz=clamp(d.hz+rnd(-0.4,0.4),-4.2,3.4);
    if(Math.random()<0.3)d.style=(Math.random()*6)|0;if(Math.random()<0.2)d.spin=now}
  var sp=d.fast&&now<d.fast?3:0.6;d.x+=(d.tx-d.x)*dt*sp;d.z+=(d.tz-d.z)*dt*sp;d.root.position.set(d.x,0,d.z);
  /* face the camera, with a little sway; an occasional spin */
  var toCam=Math.atan2(cam.position.x-d.x,cam.position.z-d.z),spn=d.spin&&now<d.spin+900?(now-d.spin)/900*Math.PI*2:0;
  d.root.rotation.y=toCam+spn+Math.sin(ph*0.5)*0.25}
function paintScreen(b,pulse){var c=screenCanvas,x=c.getContext("2d"),w=c.width,h=c.height;
  x.fillStyle="#0b0420";x.fillRect(0,0,w,h);var n=32,bw=w/n;
  for(var i=0;i<n;i++){var v=0.25+0.75*Math.abs(Math.sin(i*0.7+b*1.7)*Math.cos(i*0.31-b*0.9))*(0.6+0.4*pulse),bh=v*h*0.9;
    var g=x.createLinearGradient(0,h,0,h-bh);g.addColorStop(0,"hsl("+((i*11+b*20)%360)+",90%,50%)");g.addColorStop(1,"hsl("+((i*11+b*20+60)%360)+",95%,65%)");
    x.fillStyle=g;x.fillRect(i*bw+2,h-bh,bw-4,bh)}
  screenTex.needsUpdate=true}

var last=perf(),scrT=0;
function frame(){var now=perf(),dt=Math.min(0.05,(now-last)/1000);last=now;
  if(ok3d){var b=beat(now),pulse=Math.pow(1-(b%1),3),t=now/1000;
    stepCamera(now,dt);
    var TX=tiles.userData.TX,TZ=tiles.userData.TZ,fb=Math.floor(b),k2=0;
    for(var z=0;z<TZ;z++)for(var x=0;x<TX;x++){var on=((x+z+fb)%3===0)||((x*7+z*3+(fb>>1))%5===0);
      if(on)tileColor.setHSL(((x*40+z*25+b*20)%360)/360,0.95,0.40+0.16*pulse);else tileColor.setRGB(0.05,0.025,0.11);tiles.setColorAt(k2++,tileColor)}
    tiles.instanceColor.needsUpdate=true;
    beams.forEach(function(m,i){m.rotation.z=Math.sin(t*(0.5+i*0.13)+i)*0.55;m.rotation.x=Math.cos(t*(0.4+i*0.1)+i)*0.35;m.material.opacity=0.06+0.06*pulse});
    lights.forEach(function(l,i){l.position.set(Math.sin(t*0.7+i*2.1)*4,3.5+Math.sin(t+i)*0.8,Math.cos(t*0.6+i*2.1)*3);l.intensity=22+14*pulse});
    ball.rotation.y+=dt*0.8;speakers.forEach(function(sp){var kk=1+0.1*pulse;sp.scale.set(kk,kk,1)});
    G.neon.forEach(function(n,i){n.material.color.setHSL(((i*35+b*15)%360)/360,0.9,0.45+0.2*pulse)});G.strip.material.color.setHSL(((b*30)%360)/360,1,0.55);
    if(now-scrT>66){scrT=now;paintScreen(b,pulse)}
    chars.forEach(function(d){animChar(d,now,b,dt)});fillers.forEach(function(d){animChar(d,now,b,dt)});
    R.render(scene,cam)}
  if(demo)demoTick(dt);
  music(now);
  requestAnimationFrame(frame)}

/* ---------- music: a small synthesized club loop, in time with the dancers ---------- */
var AC=null,master=null,nextBeat=0,beatN=0;
function audio(){if(AC)return AC;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=cfg.music?0.35:0;master.connect(AC.destination)}catch(e){AC=null}return AC}
function unlock(){var a=audio();if(a&&a.state==="suspended")a.resume()}
document.addEventListener("pointerdown",unlock,{passive:true});
function music(now){if(!cfg.music||!audio()||AC.state!=="running")return;var spb=60/cfg.bpm;
  if(nextBeat<AC.currentTime-0.2){var b=beat(now);beatN=Math.ceil(b);nextBeat=AC.currentTime+(beatN-b)*spb}
  while(nextBeat<AC.currentTime+0.25){var bt=nextBeat;kick(bt);hat(bt+spb/2);if(beatN%2===1)clap(bt);bass(bt,beatN);if(beatN%4===0)chord(bt,beatN);nextBeat+=spb;beatN++}}
function env(g,t,a,d,v){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function kick(t){var o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);env(g,t,0.002,0.22,0.9);o.connect(g).connect(master);o.start(t);o.stop(t+0.3)}
var noiseBuf=null;function noise(){if(noiseBuf)return noiseBuf;var n=AC.sampleRate*0.3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;return noiseBuf=b}
function hat(t){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise();f.type="highpass";f.frequency.value=8000;env(g,t,0.001,0.05,0.18);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+0.08)}
function clap(t){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise();f.type="bandpass";f.frequency.value=1500;env(g,t,0.002,0.14,0.32);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+0.2)}
var BASS=[55,55,65.41,49];function bass(t,n){var o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),spb=60/cfg.bpm;o.type="sawtooth";o.frequency.value=BASS[Math.floor(n/4)%4];
  f.type="lowpass";f.frequency.value=420;env(g,t+spb/2,0.005,spb*0.4,0.22);o.connect(f).connect(g).connect(master);o.start(t+spb/2);o.stop(t+spb)}
var CH=[[220,277.2,329.6],[220,277.2,329.6],[261.6,329.6,392],[196,246.9,293.7]];
function chord(t,n){var spb=60/cfg.bpm;CH[Math.floor(n/4)%4].forEach(function(fq){var o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=fq;env(g,t,0.02,spb*1.6,0.05);o.connect(g).connect(master);o.start(t);o.stop(t+spb*2)})}

/* ---------- demo ---------- */
var demo=false,demoT=0,DN=["lucia_23","marcos.fit","sofi💖","dani_gamer","laura.bcn","pablo10","noe.dance","alex_mx","carla__","javi.rmz"];
function demoTick(dt){demoT-=dt;if(demoT>0)return;demoT=rnd(4,8);var i=(Math.random()*DN.length)|0;
  onEvent({type:"gift",user:"d"+i,nick:DN[i],avatar:"",gift:"Rose",coins:1,count:1})}
function setDemo(v){demo=v;$("bDemo").textContent=v?"Parar demo":"Demo"}

/* ---------- settings sheet ---------- */
function openSheet(o){$("sheet").hidden=!o;$("gear").hidden=o;if(o)fill()}
$("gear").onclick=function(){openSheet(true);unlock()};
$("close").onclick=function(){openSheet(false)};
Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.onclick=function(){
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(x){x.setAttribute("aria-selected",x===b);$(x.dataset.p).hidden=x!==b})}});
function fill(){$("oPer").value=String(cfg.per);$("oMax").value=String(cfg.max);$("oFill").value=String(cfg.fill);$("oChat").checked=cfg.chat;$("oWords").value=cfg.words;
  $("oCd").value=String(cfg.cd);$("oBpm").value=String(cfg.bpm);$("oQ").value=String(cfg.q);$("oSafe").checked=cfg.safe;musicLabel()}
function bind(id,key,num){var el=$(id);el.onchange=el.oninput=function(){cfg[key]=el.type==="checkbox"?el.checked:num?Math.max(0,+el.value||0):el.value;save();
  if(key==="q")resize();if(key==="fill")layoutFillers()}}
bind("oPer","per",1);bind("oMax","max",1);bind("oFill","fill",1);bind("oChat","chat");bind("oWords","words");bind("oCd","cd",1);bind("oBpm","bpm",1);bind("oQ","q",1);bind("oSafe","safe");
function musicLabel(){$("bMusic").textContent=cfg.music?"Música: sí":"Música: no"}
$("bMusic").onclick=function(){cfg.music=!cfg.music;save();musicLabel();unlock();if(master)master.gain.setTargetAtTime(cfg.music?0.35:0,AC.currentTime,0.05)};
$("bDemo").onclick=function(){setDemo(!demo)};
$("bClear").onclick=function(){chars.forEach(dispose);chars.length=0;for(var k in users)users[k].chars=[];focus=null};
$("bBus").onclick=function(){try{localStorage.setItem("game","bus")}catch(e){}location.href="index.html"};
var tn=0;Array.prototype.forEach.call(document.querySelectorAll("[data-test]"),function(b){b.onclick=function(){var v=b.dataset.test;tn++;
  if(v==="chat")onEvent({type:"chat",user:"c"+(tn%4),nick:"fan_"+(tn%4),avatar:"",text:String(cfg.words||"hola").split(",")[0]||"hola"});
  else onEvent({type:"gift",user:"t"+(tn%5),nick:"prueba_"+(tn%5),avatar:"",gift:"Rose",coins:1,count:1})}});

/* ---------- connection (same bridge as the bus game) ---------- */
function setStatus(ok,text){var el=$("st");el.className=ok?"ok":"bad";el.textContent=text||(ok?"Conectado":"Sin conexión");$("dot").className=ok?"ok":""}
function appLog(l){var el=$("apLog");var at=el.scrollTop+el.clientHeight>=el.scrollHeight-4;el.textContent+=(el.textContent?"\n":"")+l;
  var x=el.textContent.split("\n");if(x.length>200)el.textContent=x.slice(-200).join("\n");if(at)el.scrollTop=el.scrollHeight}
if(YT){$("apUserL").textContent="Tu canal o directo de YouTube";$("apUser").placeholder="@tucanal o enlace del directo";$("apKeyRow").hidden=true}
$("lnNote").textContent=!APP?"Vista previa: abre esta página desde la app para recibir regalos reales.":YT?
  "Escribe tu canal de YouTube (@usuario) o pega el enlace del directo. La app lee el chat sola y vuelve a intentarlo si se corta.":
  "Escribe tu usuario de TikTok. La app se conecta sola cuando empieza tu directo.";
if(APP){try{$("apUser").value=BusApp.getUser();$("apKey").value=BusApp.getKey()}catch(e){}
  $("apGo").onclick=function(){var u=$("apUser").value.trim();if(!YT)u=u.replace(/^@/,"");$("apUser").value=u;$("apLog").textContent="";try{BusApp.connect(u,$("apKey").value.trim())}catch(e){}};
  window.__bus=function(e){try{onEvent(e)}catch(x){}};window.__busLog=appLog;try{BusApp.ready()}catch(e){}}

/* ---------- boot ---------- */
function resize(){W=innerWidth;H=innerHeight;if(!ok3d)return;R.setPixelRatio(Math.min(window.devicePixelRatio||1,+cfg.q||1.25));R.setSize(W,H,false);
  cam.aspect=W/H;cam.fov=W/H<0.75?62:50;cam.updateProjectionMatrix()}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){})}catch(e){}}
window.addEventListener("resize",resize);
resize();fill();layoutFillers();setDemo(!APP);wake();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){for(var k in users){var u=users[k];if(u.label){u.label.dispose();u.label=null;relabel(u)}}});
if(APP&&!$("apUser").value){openSheet(true);document.querySelector('.tab[data-p="pLink"]').click()}
requestAnimationFrame(frame);
})();
</script>
</body>
