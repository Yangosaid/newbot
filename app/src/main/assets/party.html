<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiesta 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* A 3D night club. Whoever supported last owns the floor: every dancer wears their photo and the big screen behind the DJ
   shows them, until the next supporter takes over. The owner card and the "time on the floor" ranking sit in the band TikTok
   leaves free under its top bar; toasts slide in on the right, away from TikTok's own gift column. */
:root{
  color-scheme:dark;
  --night:#06030e; --plate:rgba(10,6,24,.78); --panel:#140d2a; --panel-2:#1f1640; --line:#3b2d6b;
  --ink:#f7f4ff; --ink-dim:#b4a9d6; --gold:#ffd23f; --silver:#d9e2ec; --bronze:#e0995e; --ok:#4ade80; --bad:#ff6b5e; --hot:#ff3d8b;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;--top:12.5%}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font:700 20px/1.3 var(--display)}
#hud{position:absolute;left:10px;right:10px;top:var(--top);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#own{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(255,210,63,.30),var(--plate) 65%);border:1px solid rgba(255,210,63,.45);
  border-radius:18px;padding:6px 12px 6px 6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#own.flash{animation:fl .7s ease}
@keyframes fl{0%{transform:scale(1)}30%{transform:scale(1.06);box-shadow:0 0 30px rgba(255,210,63,.8)}100%{transform:scale(1)}}
#own img,#own .av{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--gold)}
#own .av{display:grid;place-items:center;font:800 24px/1 var(--display);color:#fff}
#own .tx{flex:1;min-width:0}
#own .k{font:800 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
#own .n{font:800 24px/1.05 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#own .s{font:600 13px/1.2 var(--body);color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#own .t{font:800 26px/1 var(--display);white-space:nowrap}
#own.none{background:var(--plate);border-color:rgba(255,255,255,.1)}
#own.none .tx .n{font-size:19px;white-space:normal}
#rows{display:flex;gap:6px}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--plate);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px 10px 3px 3px}
.row .rk{font:800 15px/1 var(--display)}
.row img,.row .av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--c,#fff)}
.row .av{display:grid;place-items:center;font:800 12px/1 var(--display);color:#fff}
.row .nm{flex:1;min-width:0;font:700 14px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ds{font:800 14px/1 var(--display);white-space:nowrap}
.row.r1{--c:var(--gold)}.row.r1 .rk{color:var(--gold)}
.row.r2{--c:var(--silver)}.row.r2 .rk{color:var(--silver)}
.row.r3{--c:var(--bronze)}.row.r3 .rk{color:var(--bronze)}
#cta{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--ctaB,27%);max-width:92%;width:max-content;text-align:center;pointer-events:none;
  font:800 19px/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase;padding:7px 16px;border-radius:12px;background:rgba(10,6,24,.62);text-shadow:0 2px 6px rgba(0,0,0,.6)}
#cta b{color:var(--gold)}
#cta.sw{animation:sw .45s ease}
@keyframes sw{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#toasts{position:absolute;right:8px;top:46%;width:min(62%,300px);display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,rgba(255,61,139,.92),rgba(124,58,237,.92));border-radius:999px;padding:3px 12px 3px 3px;
  box-shadow:0 6px 18px rgba(0,0,0,.35);animation:tin .35s cubic-bezier(.2,.9,.3,1.3);max-width:100%}
.toast.out{animation:tout .4s ease forwards}
.toast img,.toast .av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff}
.toast .av{display:grid;place-items:center;font:800 16px/1 var(--display);background:#5b21b6}
.toast .t{min-width:0;font:700 15px/1.1 var(--display)}
.toast .t small{display:block;font:500 12px/1.2 var(--body);opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes tin{from{opacity:0;transform:translateX(40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(40px)}}
#big{position:absolute;left:0;right:0;top:41%;transform:translateY(-50%);text-align:center;pointer-events:none;padding:10px 16px 12px;
  background:linear-gradient(90deg,transparent,rgba(255,61,139,.92) 18%,rgba(124,58,237,.92) 82%,transparent);animation:bigIn .5s cubic-bezier(.2,.9,.3,1.4)}
#big .n{font:800 18px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase}
#big .v{font:800 italic 42px/1 var(--display);text-shadow:0 3px 0 rgba(0,0,0,.25)}
#big img,#big .av{width:62px;height:62px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);display:block;margin:0 auto 4px}
#big .av{display:grid;place-items:center;font:800 26px/1 var(--display);background:#5b21b6}
@keyframes bigIn{from{opacity:0;transform:translateY(-50%) scale(.6)}to{opacity:1;transform:translateY(-50%) scale(1)}}
#chip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--ctaB,27%) - 34px);background:rgba(255,210,63,.95);color:#1a1200;
  font:800 12px/1 var(--display);letter-spacing:.08em;padding:5px 10px;border-radius:8px;pointer-events:none}
#gear{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,6,24,.7);
  color:var(--ink);font-size:21px;line-height:1;cursor:pointer;opacity:.75}
#gear i{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--night)}
#gear i.ok{background:var(--ok)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:0 16px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
#tabs{position:sticky;top:0;display:flex;gap:4px;align-items:center;background:var(--panel);padding:12px 0 8px;z-index:1}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-dim);font:800 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:8px 2px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hot)}
#close{background:var(--panel-2);border:0;color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
.grp{background:var(--panel-2);border-radius:12px;padding:10px 12px;margin:10px 0}
.grp h3{margin:0 0 6px;font:800 15px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:7px 0}
.ln label{flex:1;min-width:150px;font-size:14px}
.ln .grow{flex:1;min-width:0}
.note{font-size:13px;line-height:1.45;color:var(--ink-dim);margin:8px 0}
.btn{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:700 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.btn.go{background:var(--hot);border-color:var(--hot);color:#fff}
input[type=text],input[type=number],select{background:#0c0820;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:500 15px var(--body)}
input[type=number]{width:80px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--hot)}
#st.ok{color:var(--ok)}#st.bad{color:var(--bad)}
#apLog{max-height:30vh;overflow:auto;white-space:pre-wrap;font:12px/1.35 monospace;color:var(--ink-dim);background:rgba(0,0,0,.35);border-radius:8px;padding:8px;margin:8px 0 0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="nogl" hidden>Este teléfono no puede mostrar gráficos 3D.<br>Vuelve a la batalla de buses desde ⚙.</div>
  <div id="hud"><div id="own" class="none"></div><div id="rows"></div></div>
  <div id="cta"></div>
  <div id="toasts"></div>
  <div id="big" hidden></div>
  <div id="chip" hidden>MODO DEMO · REGALOS DE PRUEBA</div>
  <button id="gear" aria-label="Ajustes">⚙<i id="dot"></i></button>

  <div id="sheet" hidden>
    <div id="tabs" role="tablist">
      <button class="tab" role="tab" data-p="pCtl" aria-selected="true">Control</button>
      <button class="tab" role="tab" data-p="pRules" aria-selected="false">Reglas</button>
      <button class="tab" role="tab" data-p="pLink" aria-selected="false">Conexión</button>
      <button id="close" aria-label="Cerrar">✕</button>
    </div>
    <div class="pane" id="pCtl">
      <div class="ln"><button class="btn" id="bDemo"></button><button class="btn" id="bMusic"></button><button class="btn" id="bClear">Reiniciar ranking</button></div>
      <div class="ln"><button class="btn go" id="bBus">🚌 Ir a la batalla de buses</button></div>
      <div class="grp"><h3>Probar</h3>
        <div class="ln"><button class="btn" data-test="1">Rosa</button><button class="btn" data-test="30">Donut</button><button class="btn" data-test="500">León</button><button class="btn" data-test="chat">Comentario</button></div>
      </div>
      <label class="ln"><input type="checkbox" id="oSafe"><span>Dejar libre la zona que tapa el directo (barra de arriba y chat)</span></label>
    </div>
    <div class="pane" id="pRules" hidden>
      <div class="grp"><h3>Quién domina la pista</h3>
        <p class="note">El último que apoya se queda en la pista con su foto hasta que otro apoya. Gana el ranking quien más tiempo acumula.</p>
        <div class="ln"><label for="oMin">Monedas mínimas para quitar la pista</label><input type="number" id="oMin" min="1" inputmode="numeric"></div>
        <label class="ln"><input type="checkbox" id="oChat"><span>Los comentarios también quitan la pista</span></label>
        <div class="ln"><label for="oWords">Palabras (vacío = cualquier comentario)</label><input type="text" id="oWords" class="grow"></div>
        <div class="ln"><label for="oProt">Protección tras un regalo (los comentarios no pueden quitar la pista)</label><select id="oProt"><option value="0">Sin protección</option><option value="10">10 s</option><option value="30">30 s</option><option value="60">1 min</option></select></div>
        <div class="ln"><label for="oCd">Espera por espectador</label><select id="oCd"><option value="3">3 s</option><option value="10">10 s</option><option value="30">30 s</option></select></div>
      </div>
      <div class="grp"><h3>Pista</h3>
        <div class="ln"><label for="oMode">Quién lleva la foto</label><select id="oMode"><option value="all">Todos los bailarines</option><option value="star">Solo la estrella del centro</option></select></div>
        <div class="ln"><label for="oN">Bailarines</label><select id="oN"><option value="9">9</option><option value="15">15</option><option value="21">21</option><option value="30">30</option></select></div>
        <div class="ln"><label for="oBpm">Ritmo</label><select id="oBpm"><option value="100">100 BPM</option><option value="118">118 BPM</option><option value="128">128 BPM</option><option value="140">140 BPM</option></select></div>
        <div class="ln"><label for="oQ">Calidad</label><select id="oQ"><option value="2">Alta</option><option value="1.25">Media</option><option value="0.8">Ahorro de batería</option></select></div>
      </div>
    </div>
    <div class="pane" id="pLink" hidden>
      <div class="ln"><span>Estado:</span><span id="st" class="bad">Sin conexión</span></div>
      <p class="note" id="lnNote"></p>
      <div class="ln"><label for="apUser" id="apUserL">Tu usuario de TikTok</label><input type="text" id="apUser" class="grow" placeholder="usuario (sin @)" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
      <div class="ln" id="apKeyRow"><label for="apKey">Clave Euler Stream</label><input type="text" id="apKey" class="grow" placeholder="opcional" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
      <div class="ln"><button class="btn go" id="apGo">Guardar y conectar</button></div>
      <pre id="apLog"></pre>
    </div>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var APP=!!window.BusApp;
var SRC=APP&&BusApp.getSource?String(BusApp.getSource()):"tiktok",YT=SRC==="youtube";
try{localStorage.setItem("game","party")}catch(e){}

/* ---------- settings ---------- */
var DEF={min:1,chat:YT,words:"",prot:YT?30:10,cd:YT?10:3,mode:"all",n:21,bpm:118,q:1.25,music:true,safe:true};
var cfg=Object.assign({},DEF);
try{var sv=JSON.parse(localStorage.getItem("party3d")||"null");if(sv)cfg=Object.assign(cfg,sv)}catch(e){}
function save(){try{localStorage.setItem("party3d",JSON.stringify(cfg))}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function norm(s){s=String(s==null?"":s).toLowerCase();try{s=s.normalize("NFD").replace(/[̀-ͯ]/g,"")}catch(e){}return s.replace(/ı/g,"i").trim()}
function initial(s){var c=String(s).replace(/[^A-Za-z0-9À-ÿ]/g,"").charAt(0);return (c||String(s).charAt(0)||"?").toUpperCase()}
function hashHue(s){var h=0;s=String(s);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%360}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function rnd(a,b){return a+Math.random()*(b-a)}
function clock(s){s=Math.floor(s);if(s>=3600)return Math.floor(s/3600)+"h "+("0"+Math.floor(s%3600/60)).slice(-2)+"m";return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function perf(){return performance.now()}

/* ---------- supporters ---------- */
var users={},owner=null,ownerSince=0,lastGiftAt=-1e9;
function userOf(e){var uid=String(e.user||e.nick||"?"),u=users[uid];
  if(!u)u=users[uid]={uid:uid,nick:String(e.nick||e.user||"Fan"),av:"",img:null,tex:null,hue:hashHue(uid),held:0,coins:0,lastChat:-1e9};
  if(e.nick)u.nick=String(e.nick);
  if(e.avatar&&e.avatar!==u.av){u.av=String(e.avatar);loadPhoto(u)}
  return u}

/* Photos reach WebGL as same-origin pictures: inside the app Java fetches them (data: URL); in a browser preview they load normally. */
var imgWait={},imgN=0;
window.__busImg=function(id,data){var cb=imgWait[id];delete imgWait[id];if(cb)cb(data)};
function loadPhoto(u){var url=u.av;
  var done=function(src){if(!src||u.av!==url)return;var im=new Image();im.onload=function(){if(u.av!==url)return;u.img=im;u.tex=null;refreshFaces(u)};im.src=src};
  if(APP&&BusApp.image){var id="i"+(++imgN);imgWait[id]=done;try{BusApp.image(url,id)}catch(e){}}
  else done(url)}

/* the face texture: round photo (or initial), with a gold ring for the owner */
function faceCanvas(u,ring){var S=256,c=document.createElement("canvas");c.width=c.height=S;var x=c.getContext("2d");
  x.fillStyle=ring;x.beginPath();x.arc(S/2,S/2,S/2,0,7);x.fill();
  x.save();x.beginPath();x.arc(S/2,S/2,S/2-14,0,7);x.clip();
  if(u&&u.img){var im=u.img,k=Math.max((S-28)/im.width,(S-28)/im.height);try{x.drawImage(im,(S-im.width*k)/2,(S-im.height*k)/2,im.width*k,im.height*k)}catch(e){}}
  else{var g=x.createLinearGradient(0,0,S,S),h=u?u.hue:30;g.addColorStop(0,"hsl("+h+",80%,58%)");g.addColorStop(1,"hsl("+((h+50)%360)+",75%,38%)");x.fillStyle=g;x.fillRect(0,0,S,S);
    x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";
    if(u&&!u.anon){x.font="800 130px 'Barlow Condensed',Arial,sans-serif";x.fillText(initial(u.nick),S/2,S/2+8)}
    else{x.fillStyle="#2a1d10";x.beginPath();x.arc(S*0.38,S*0.45,13,0,7);x.arc(S*0.62,S*0.45,13,0,7);x.fill();x.lineWidth=10;x.strokeStyle="#2a1d10";x.beginPath();x.arc(S/2,S*0.55,48,0.25*Math.PI,0.75*Math.PI);x.stroke()}}
  x.restore();return c}
function texOf(c){var t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=2;return t}
function faceFor(u){if(!u.tex)u.tex=texOf(faceCanvas(u,"#ffd23f"));return u.tex}
var anonTex=[];
function anonFace(i){if(!anonTex.length){var hues=[20,200,280,120,330,45];for(var k=0;k<6;k++)anonTex.push(texOf(faceCanvas({hue:hues[k],nick:"",anon:1,img:null},"#ffffff")))}return anonTex[i%anonTex.length]}

/* ---------- 3D scene ---------- */
var R=null,scene,cam,ok3d=true;
try{if(!window.THREE)throw 0;R=new THREE.WebGLRenderer({canvas:$("gl"),antialias:true,powerPreference:"high-performance"})}catch(e){ok3d=false;$("nogl").hidden=false}
var W=0,H=0,tiles,tileColor,screenTex,screenCanvas,ball,beams=[],lights=[],speakers=[],confetti,confettiData=[],dancers=[],G={};
if(ok3d){
  tileColor=new THREE.Color();
  R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;
  scene=new THREE.Scene();scene.background=new THREE.Color(0x06030e);scene.fog=new THREE.Fog(0x06030e,14,34);
  cam=new THREE.PerspectiveCamera(52,1,0.1,80);
  scene.add(new THREE.HemisphereLight(0x8a7cff,0x1a0830,0.9));scene.add(new THREE.AmbientLight(0x30204a,0.6));
  var key=new THREE.DirectionalLight(0xffffff,0.9);key.position.set(2,8,8);scene.add(key);
  [0xff3d8b,0x22d3ee,0xffd23f].forEach(function(col){var l=new THREE.PointLight(col,30,16,1.6);l.position.set(0,4,0);scene.add(l);lights.push(l)});

  /* floor: LED tiles that light up to the beat */
  var TX=12,TZ=10,m4=new THREE.Matrix4(),k=0;
  tiles=new THREE.InstancedMesh(new THREE.BoxGeometry(0.94,0.06,0.94),new THREE.MeshBasicMaterial({color:0xffffff}),TX*TZ);
  for(var z=0;z<TZ;z++)for(var xx=0;xx<TX;xx++){m4.makeTranslation(xx-TX/2+0.5,0,z-TZ/2+0.5);tiles.setMatrixAt(k,m4);tiles.setColorAt(k,new THREE.Color(0x140a30));k++}
  tiles.userData={TX:TX,TZ:TZ};scene.add(tiles);
  var base=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:0x07040f}));base.rotation.x=-Math.PI/2;base.position.y=-0.04;scene.add(base);

  /* back wall, LED screen with the owner, neon strips */
  var wall=new THREE.Mesh(new THREE.PlaneGeometry(40,16),new THREE.MeshLambertMaterial({color:0x120a26}));wall.position.set(0,8,-7.5);scene.add(wall);
  screenCanvas=document.createElement("canvas");screenCanvas.width=1024;screenCanvas.height=512;screenTex=texOf(screenCanvas);
  var frameM=new THREE.Mesh(new THREE.PlaneGeometry(8.8,4.6),new THREE.MeshBasicMaterial({color:0x000000}));frameM.position.set(0,4.35,-7.42);scene.add(frameM);
  var scr=new THREE.Mesh(new THREE.PlaneGeometry(8.4,4.2),new THREE.MeshBasicMaterial({map:screenTex}));scr.position.set(0,4.35,-7.4);scene.add(scr);
  var neon=function(w,h,x,y,z,col){var n=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.06),new THREE.MeshBasicMaterial({color:col}));n.position.set(x,y,z);scene.add(n);return n};
  G.neon=[neon(9.2,0.08,0,6.75,-7.35,0xff3d8b),neon(9.2,0.08,0,1.95,-7.35,0x22d3ee),neon(0.08,4.8,-4.6,4.35,-7.35,0xff3d8b),neon(0.08,4.8,4.6,4.35,-7.35,0xff3d8b)];
  for(var s=-1;s<=1;s+=2)for(var j=0;j<5;j++)G.neon.push(neon(0.06,3.2,s*8.5,1.8,-6+j*2.6,j%2?0x7c3aed:0x22d3ee));

  /* DJ booth and speakers */
  var booth=new THREE.Mesh(new THREE.BoxGeometry(3.4,1.1,1.1),new THREE.MeshStandardMaterial({color:0x1b1033,roughness:.6,metalness:.3}));booth.position.set(0,0.55,-5.6);scene.add(booth);

function toast(u,sub){var el=document.createElement("div");el.className="toast";el.innerHTML=avHtml(u)+'<div class="t">'+esc(u.nick)+'<small>'+esc(sub)+'</small></div>';
  var box=$("toasts");box.insertBefore(el,box.firstChild);while(box.children.length>4)box.removeChild(box.lastChild);
  setTimeout(function(){el.classList.add("out");setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},420)},4200)}

/* ---------- music: a small synthesized club loop, in time with the dancers ---------- */
var AC=null,master=null,nextBeat=0,beatN=0;
function audio(){if(AC)return AC;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=cfg.music?0.35:0;master.connect(AC.destination)}catch(e){AC=null}return AC}
function unlock(){var a=audio();if(a&&a.state==="suspended")a.resume()}
document.addEventListener("pointerdown",unlock,{passive:true});
function music(now){if(!cfg.music||!audio()||AC.state!=="running")return;var spb=60/cfg.bpm;
  if(nextBeat<AC.currentTime-0.2){var b=beat(now);beatN=Math.ceil(b);nextBeat=AC.currentTime+(beatN-b)*spb}
  while(nextBeat<AC.currentTime+0.25){var bt=nextBeat;kick(bt);hat(bt+spb/2);if(beatN%2===1)clap(bt);bass(bt,beatN);if(beatN%4===0)chord(bt,beatN);nextBeat+=spb;beatN++}}
function env(g,t,a,d,v){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function kick(t){var o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);env(g,t,0.002,0.22,0.9);o.connect(g).connect(master);o.start(t);o.stop(t+0.3)}
var noiseBuf=null;function noise(){if(noiseBuf)return noiseBuf;var n=AC.sampleRate*0.3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;return noiseBuf=b}
function hat(t){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise();f.type="highpass";f.frequency.value=8000;env(g,t,0.001,0.05,0.18);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+0.08)}
function clap(t){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise();f.type="bandpass";f.frequency.value=1500;env(g,t,0.002,0.14,0.32);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+0.2)}
var BASS=[55,55,65.41,49];function bass(t,n){var o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),spb=60/cfg.bpm;o.type="sawtooth";o.frequency.value=BASS[Math.floor(n/4)%4];
  f.type="lowpass";f.frequency.value=420;env(g,t+spb/2,0.005,spb*0.4,0.22);o.connect(f).connect(g).connect(master);o.start(t+spb/2);o.stop(t+spb)}
var CH=[[220,277.2,329.6],[220,277.2,329.6],[261.6,329.6,392],[196,246.9,293.7]];
function chord(t,n){var spb=60/cfg.bpm;CH[Math.floor(n/4)%4].forEach(function(fq){var o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=fq;env(g,t,0.02,spb*1.6,0.05);o.connect(g).connect(master);o.start(t);o.stop(t+spb*2)})}
function blip(f,d,v,type){if(!audio()||AC.state!=="running")return;var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d);env(g,t,0.005,d,v);o.connect(g).connect(master);o.start(t);o.stop(t+d+0.05)}
function sfxGift(){[880,1108].forEach(function(f,i){setTimeout(function(){blip(f,0.12,0.16,"triangle")},i*70)})}
function sfxTake(coins){var notes=coins>=100?[523,659,784,1046,1318]:[659,880,1108];notes.forEach(function(f,i){setTimeout(function(){blip(f,0.16,0.2,coins>=100?"square":"triangle")},i*75)})}
