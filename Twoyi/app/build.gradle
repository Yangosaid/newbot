plugins {
    id 'com.android.application'
}

android {
    namespace 'io.twoyi'
    compileSdk 35
    ndkVersion "29.0.13846066"

    def buildSerial = new SimpleDateFormat("MMddHHmm").format(new Date())

    defaultConfig {
        applicationId "io.twoyi"
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 27
        versionCode 11000
        versionName "0.10.0-${buildSerial}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a"
        }
        // targetSdk must stay <= 28: the container executes ./init from app data (W^X rule for newer targets)
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

task cargoBuild {
    doLast {
        exec {
            //切换到sh文件所在的目录，执行脚本
            workingDir new File(project.projectDir, "rs")
            //执行shell脚本 "," 传参
            commandLine "sh", "build_rs.sh", "--release"
        }
    }
}

preBuild.dependsOn cargoBuild

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    implementation 'io.github.medyo:android-about-page:2.0.0'
    implementation 'de.psdev.licensesdialog:licensesdialog:2.2.0'

    implementation 'org.jdeferred:jdeferred-android-aar:1.2.6'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'

    implementation 'com.github.hzy3774:AndroidP7zip:v1.7.2'
}
