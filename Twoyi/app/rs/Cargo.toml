[package]
name = "twoyi"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# This must contain at least cdylib for Android libraries to be generated.
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
once_cell = "1"

# for log
log = "0.4"
android_logger = "0.14"

ndk = "0.9"
ndk-sys = "0.6"
jni = { version = "0.21", default-features = false }

# for input system
uinput-sys = "0.1.7"

[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
uinput-sys = { git = 'https://github.com/tiann/rust-uinput-sys' }